const $=id=>document.getElementById(id), money=n=>'EC$ '+n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const defaultState={mode:'construction',people:[{id:1,name:'Marcus Joseph',role:'Carpenter',rate:24},{id:2,name:'Alana Charles',role:'Site supervisor',rate:32},{id:3,name:'Devon Baptiste',role:'Mason',rate:22}],guards:[{id:11,name:'Kevin Pierre',role:'Security officer',rate:16},{id:12,name:'Diana James',role:'Shift supervisor',rate:21},{id:13,name:'Andre Paul',role:'Security officer',rate:16}],events:[],clocks:{},reviews:[],leave:[],relief:false};let state;try{state=JSON.parse(localStorage.getItem('oecs-studio-v1'))||structuredClone(defaultState)}catch{state=structuredClone(defaultState)}let page='Overview';
function persist(){try{localStorage.setItem('oecs-studio-v1',JSON.stringify(state));return true}catch{toast('Storage unavailable. This change is not saved.');return false}}
function toast(s){$('toast').textContent=s;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',4000)}
function edition(m){state.mode=m;persist();render()}function people(){return state.mode==='construction'?state.people:state.guards}function sites(){return state.mode==='construction'?['Castries · Civic works','Gros Islet · Villas']:['Harbour Gate · Post A','Airport Warehouse · Post B']}function go(p){page=p;render()}
const pages=['Overview','AI Paymaster','Time clock','Time approval','People & leave','Roster & sites','Payroll preview','Job cost / billing','Reports & QuickBooks','Why OECS Workforce','Contact us'];
function table(head,rows){return '<div class="scroll"><table><thead><tr>'+head.map(h=>'<th>'+h+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map(c=>'<td>'+c+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>'}function card(t,b){return '<section class="card"><h2>'+t+'</h2>'+b+'</section>'}function metric(t,v,n){return '<div class="card"><small>'+t+'</small><div class="metric">'+v+'</div><span class="mini muted">'+n+'</span></div>'}function title(k,t,d){return '<div class="topline"><div><span class="eyebrow">'+k+'</span><h1>'+t+'</h1><div class="muted">'+d+'</div></div><button onclick="window.print()">Print view</button></div>'}
function render(){document.querySelectorAll('.editions button').forEach(b=>b.classList.toggle('active',b.id===state.mode));$('nav').innerHTML=pages.map((p,i)=>'<button class="'+(page===p?'active':'')+'" onclick="go(pages['+i+'])">'+String(i+1).padStart(2,'0')+' / '+p+'</button>').join('');let fn={'Overview':overview,'AI Paymaster':aiPaymaster,'Time clock':clock,'Time approval':approvals,'People & leave':directory,'Roster & sites':roster,'Payroll preview':payroll,'Job cost / billing':costing,'Reports & QuickBooks':reports,'Why OECS Workforce':review,'Contact us':buildplan}[page];$('content').innerHTML=fn();if(page==='Payroll preview')calc();tick()}
function overview(){let c=state.mode==='construction',pending=state.events.filter(e=>e.mode===state.mode&&e.status!=='Approved').length;return title('CARIBBEAN PAYROLL AS A SERVICE',c?'Build with confidence. Pay with clarity.':'Every post covered. Every hour accounted for.','A connected workforce experience for your business, from the first clock-in to the payroll review.')+'<div class="hero"><div><span class="mini">'+(c?'FOR CONTRACTORS & CONSTRUCTION COMPANIES':'FOR SECURITY COMPANIES')+'</span><h2>'+(c?'Less paperwork. More control on site.':'Clearer attendance. Stronger shift control.')+'</h2><p>'+(c?'Bring crews, job sites, working hours and labor costs into one clear view.':'Bring guards, client sites, overnight shifts and time records into one clear view.')+'</p></div><button class="gold" onclick="go(\'Time clock\')">Try the time clock →</button></div><div class="grid">'+metric('People in this demo',people().length,c?'Trades, crews and supervisors':'Officers, supervisors and relief')+metric('Work sites',2,c?'Connect hours to projects':'Connect hours to client posts')+metric('Events awaiting review',pending,'Try capturing and reviewing time')+metric('Connected workflow','Time → Pay','One view from attendance to costing')+'</div><div class="two">'+card(c?'See where your labor goes':'See where your officers are assigned',c?'<div class="row spread"><span>Civic works · concrete</span><b>36 hours</b></div><div class="bar"><i style="width:75%"></i></div><div class="row spread"><span>Villas · carpentry</span><b>12 hours</b></div><div class="bar"><i style="width:25%;background:#e6ac42"></i></div><small>Illustrative allocation. Explore how hours, wage rates and employer costs affect your labor budget.</small>':'<div class="row spread"><b>Harbour Gate · 18:00–06:00</b><span class="badge">Assigned</span></div><div class="listitem">Warehouse Post B · 22:00–06:00 <span class="badge '+(state.relief?'':'warn')+'">'+(state.relief?'Relief assigned':'Relief required')+'</span></div><p>Explore a roster designed around client sites, overnight duty and relief cover.</p><button onclick="go(\'Roster & sites\')">Explore shift coverage →</button>')+card('Take a guided tour','<div class="listitem"><b>01 · Capture time</b><p class="mini muted">Clock in, record a break and move between sites.</p></div><div class="listitem"><b>02 · Review attendance</b><p class="mini muted">Record a supervisor decision before payroll preparation.</p></div><div class="listitem"><b>03 · Explore your costs</b><p class="mini muted">Adjust hours and rates to see the financial effect.</p></div><div class="action"><button onclick="go(\'Contact us\')">Discuss your business →</button></div>')+'</div><div class="three">'+card('A clock your team can use','Explore personal-phone and shared-tablet clock workflows, including breaks and work-site selection.')+card('Meet your AI Paymaster','Let the assistant flag missed punches, propose corrections and prepare a payroll pack for your approval.<p><button onclick="go(\'AI Paymaster\')">Try AI Paymaster →</button></p>')+card('Built around your industry',c?'Follow the work by project, crew and cost code, with a clear labor budget view.':'Follow the work by client, post and shift, with separate employee pay and client billing views.')+'</div><div class="notice">Interactive demonstration using sample records. Changes stay in this browser. No wages, payments or external transactions are processed.</div>'}
function clock(){let p=people(),id=p[0].id;return title('ATTENDANCE FIRST','The time clock','Try clocking in, recording a break and transferring between work sites.')+'<div class="two">'+card('Capture a work event','<label for="worker">Employee</label><select id="worker" onchange="clockStatus()">'+p.map(p=>'<option value="'+p.id+'">'+esc(p.name)+' · '+esc(p.role)+'</option>').join('')+'</select><label for="site">Work site / post</label><select id="site">'+sites().map(s=>'<option>'+s+'</option>').join('')+'</select><label for="code">Cost code / assignment</label><select id="code">'+(state.mode==='construction'?['03-Concrete','06-Carpentry','Paid site travel','Standby review']:['Standard duty','Relief duty','Supervisor round']).map(s=>'<option>'+s+'</option>').join('')+'</select><label for="capture">Capture mode</label><select id="capture"><option>Personal phone demo</option><option>Shared kiosk demo</option></select><label class="row"><input type="checkbox" id="offline"> Simulate offline capture</label><div class="notice">Try the workflow using sample employees. This demonstration does not request a PIN, photo or location.</div>')+'<div class="clockbox"><span class="badge">YOUR WORKDAY AT A GLANCE</span><div class="clockface" id="time">--:--:--</div><small id="clockstatus">Off duty</small><div class="action" style="justify-content:center"><button id="in" class="gold" onclick="punch(\'Clock in\')">Clock in</button><button id="break" onclick="punch(\'Start break\')">Start break</button><button id="resume" onclick="punch(\'End break\')">End break</button><button id="transfer" onclick="punch(\'Site transfer\')">Transfer to selected site</button><button id="out" onclick="punch(\'Clock out\')">Clock out</button></div><p class="mini">Select the destination site before transferring. Breaks in this demo are unpaid. All captured events require supervisor review.</p><button onclick="simulateSync()">Review queued demo events</button><p class="mini">Offline workflow simulation · sample events stay in this browser</p></div></div>'+card('Event trail',eventTable())}
function clockStatus(){if(!$('worker'))return;let s=state.clocks[$('worker').value]||{status:'off'};$('clockstatus').textContent=s.status==='off'?'Off duty':s.status==='break'?'On unpaid break':'On duty · '+s.site;$('in').disabled=s.status!=='off';$('out').disabled=s.status==='off';$('break').disabled=s.status!=='on';$('resume').disabled=s.status!=='break';$('transfer').disabled=s.status!=='on'}
function punch(type){let selected={worker:$('worker').value,site:$('site').value,code:$('code').value,capture:$('capture').value,offline:$('offline').checked};let id=+$('worker').value,s=state.clocks[id]||{status:'off'},valid={'Clock in':['off'],'Start break':['on'],'End break':['break'],'Site transfer':['on'],'Clock out':['on','break']};if(!valid[type].includes(s.status))return toast('Invalid clock transition');let site=$('site').value;if(type==='Site transfer'&&site===s.site)return toast('Choose a different destination site first.');let old=structuredClone(state),time=new Date().toISOString();state.events.push({id:crypto.randomUUID(),mode:state.mode,employee:id,name:people().find(p=>p.id===id).name,type,time,site:type==='Clock in'||type==='Site transfer'?site:s.site,code:$('code').value,source:$('capture').value,status:$('offline').checked?'Saved locally':'Pending review'});state.clocks[id]={status:type==='Clock out'?'off':type==='Start break'?'break':'on',site:type==='Clock in'||type==='Site transfer'?site:s.site};if(!persist()){state=old;return}toast(type+' saved in this browser');$('content').innerHTML=clock();['worker','site','code','capture'].forEach(k=>$(k).value=selected[k]);$('offline').checked=selected.offline;tick()}
function eventTable(){let e=state.events.filter(e=>e.mode===state.mode).slice().reverse();return e.length?table(['Employee / event','Captured UTC','Site / code','Status'],e.map(e=>[esc(e.name)+'<br><b>'+e.type+'</b>',new Date(e.time).toLocaleString()+'<br><small>'+e.time+'</small>',esc(e.site)+'<br><small>'+esc(e.code)+'</small>','<span class="badge '+(e.status==='Approved'?'':'warn')+'">'+e.status+'</span>'])):'<p class="muted">No demonstration punches yet. Clock in to create an event.</p>'}
function simulateSync(){let n=0;state.events.forEach(e=>{if(e.mode===state.mode&&e.status==='Saved locally'){e.status='Pending review';n++}});persist();render();toast(n+' local events moved to review (simulation)')}
function approvals(){let events=state.events.filter(e=>e.mode===state.mode&&e.status==='Pending review');return title('SUPERVISOR DESK','Review time before pay','Give supervisors a clear record of attendance decisions.')+card('Pending captured events',events.length?table(['Employee','Event','Site','Review'],events.map(e=>[esc(e.name),e.type,esc(e.site),'<button onclick="approve(\''+e.id+'\')">Review event</button>'])):'<p>No pending events. Capture time or move locally queued events to review first.</p>')+'<div class="notice">This demonstration shows event review. A completed payroll workflow brings reviewed shifts, breaks and employee rates together before wages are prepared.</div>'+card('Review trail',state.reviews.length?table(['Event','Decision','Reason','Recorded'],state.reviews.filter(r=>r.mode===state.mode).map(r=>[r.event,'Approved',esc(r.reason),new Date(r.time).toLocaleString()])):'No review actions yet.')}
function approve(id){$('modal').innerHTML='<h2>Supervisor review</h2><p>Confirm the event and record a review reason.</p><form onsubmit="saveApproval(event,\''+id+'\')"><label for="reason">Reason / evidence</label><textarea id="reason" required minlength="5"></textarea><div class="action"><button class="primary">Approve demo event</button><button type="button" onclick="$(\'modal\').close()">Cancel</button></div></form>';$('modal').showModal()}
function saveApproval(ev,id){ev.preventDefault();let e=state.events.find(e=>e.id===id);e.status='Approved';state.reviews.push({mode:state.mode,event:e.type,reason:$('reason').value,time:new Date().toISOString()});persist();$('modal').close();render();toast('Review saved')}
function directory(){return title('PEOPLE & HR','Your workforce directory','Demo employees, editable rates and leave request tracking')+card('Employees',table(['Employee','Trade / role','Hourly rate',''],people().map(p=>[esc(p.name),esc(p.role),money(p.rate),'<button onclick="editPerson('+p.id+')">Edit</button>'])))+'<div class="two section" style="margin-top:22px">'+card('Request leave','<form onsubmit="requestLeave(event)"><label for="leavePerson">Employee</label><select id="leavePerson">'+people().map(p=>'<option>'+esc(p.name)+'</option>').join('')+'</select><label>From</label><input type="date" id="leaveFrom" required><label>To</label><input type="date" id="leaveTo" required><label for="leaveType">Leave type</label><select id="leaveType"><option>Annual leave</option><option>Sick leave</option><option>Unpaid leave</option></select><div class="action"><button class="primary">Save request</button></div></form>')+card('Leave requests',state.leave.filter(l=>l.mode===state.mode).map(l=>'<div class="listitem"><b>'+esc(l.name)+'</b><p>'+esc(l.type)+' · '+l.from+' to '+l.to+'</p><span class="badge warn">Pending supervisor review</span></div>').join('')||'<p class="muted">No demonstration requests.</p>')+'</div>'}
function editPerson(id){let p=people().find(p=>p.id===id);$('modal').innerHTML='<h2>Edit demo employee</h2><form onsubmit="savePerson(event,'+id+')"><label for="pname">Name</label><input id="pname" value="'+esc(p.name)+'" required><label for="prole">Role</label><input id="prole" value="'+esc(p.role)+'" required><label for="prate">Hourly rate · XCD</label><input id="prate" type="number" min="0.01" max="10000" step="0.01" value="'+p.rate+'" required><div class="action"><button class="primary">Save</button><button type="button" onclick="$(\'modal\').close()">Cancel</button></div></form>';$('modal').showModal()}
function savePerson(e,id){e.preventDefault();let p=people().find(p=>p.id===id);p.name=$('pname').value;p.role=$('prole').value;p.rate=+$('prate').value;persist();$('modal').close();render()}
function requestLeave(e){e.preventDefault();if($('leaveTo').value<$('leaveFrom').value)return toast('End date must follow start date');state.leave.push({mode:state.mode,name:$('leavePerson').value,type:$('leaveType').value,from:$('leaveFrom').value,to:$('leaveTo').value});persist();render();toast('Demo leave request saved')}
function roster(){let c=state.mode==='construction';return title('FIELD OPERATIONS',c?'Crews, projects & cost codes':'Posts, shifts & relief',c?'Allocate labor to the work performed.':'Protect coverage across midnight and handover.')+card(c?'Example crew plan':'Example shift coverage',table(c?['Project','Crew','Schedule','Allocation']:['Post','Officer','Shift','Coverage'],c?[[sites()[0],'Concrete crew','07:00–16:00','03-Concrete'],[sites()[1],'Finishing crew','08:00–17:00','06-Carpentry']]:[[sites()[0],esc(state.guards[0].name),'18:00 today → 06:00 next day','<span class="badge">Assigned</span>'],[sites()[1],state.relief?esc(state.guards[2].name):'Unfilled','22:00 today → 06:00 next day',state.relief?'<span class="badge">Relief assigned</span>':'<button onclick="state.relief=true;persist();render();toast(\'Demo relief assignment saved\')">Assign available relief</button>']] ))+'<div class="three section" style="margin-top:22px">'+card(c?'Skill & safety readiness':'Qualification readiness',c?'Keep workforce skills, safety inductions and equipment authorizations visible alongside crew planning.':'Bring guard licences, site induction and assignment requirements into the workforce conversation.')+card(c?'Daywork & variations':'Patrol & incidents',c?'Keep daywork, approved quantities and standby or travel categories connected to the work performed.':'Connect tour checkpoints, incident evidence and welfare workflows with your field operations.')+card(c?'Contractor control':'Fatigue & handover',c?'Track contractor commitments and payments alongside your employee labor view.':'Keep shift overlaps, rest periods and relief handover in view as you plan coverage.')+'</div><div class="notice">Sample roster for demonstration. Try assigning relief to the vacant post; no employee is notified.</div>'}
function payroll(){return title('PAYROLL PREVIEW','See how hours become earnings','Explore a sample weekly gross-pay calculation with your own hours and rates.')+'<div class="two">'+card('Explore a sample pay week','<label for="payperson">Employee</label><select id="payperson" onchange="$(\'rate\').value=people().find(p=>p.id==this.value).rate;calc()">'+people().map(p=>'<option value="'+p.id+'">'+esc(p.name)+'</option>').join('')+'</select><label for="hours">Total worked hours</label><input id="hours" type="number" min="0" max="168" step="0.25" value="48" oninput="calc()"><label for="rate">Hourly rate · XCD</label><input id="rate" type="number" min="0" max="10000" step="0.01" value="'+people()[0].rate+'" oninput="calc()"><label for="threshold">Illustrative overtime threshold</label><input id="threshold" type="number" min="1" max="168" value="40" oninput="calc()"><label for="mult">Illustrative overtime multiplier</label><input id="mult" type="number" min="1" max="5" step="0.25" value="1.5" oninput="calc()"><label for="addition">Other additions · XCD</label><input id="addition" type="number" min="0" max="1000000" value="0" oninput="calc()">')+card('Gross-pay preview','<div id="result"></div><div class="notice">Illustrative gross pay only. Your country rules, employee deductions and contractual premiums are configured during onboarding. This demo does not calculate net pay or process payments.</div><button disabled>Demonstration only · no payment processing</button>')+'</div>'}
function calc(){let [h,r,t,m,a]=['hours','rate','threshold','mult','addition'].map(id=>+$(id).value);if(![h,r,t,m,a].every(Number.isFinite)||h<0||h>168||r<0||t<=0||t>168||m<1||m>5||a<0){$('result').textContent='Enter valid non-negative values within the displayed limits.';return}let reg=Math.min(h,t),ot=Math.max(0,h-t),gross=reg*r+ot*r*m+a;$('result').innerHTML=table(['Component','Hours','Amount'],[['Regular',reg.toFixed(2),money(reg*r)],['Overtime',ot.toFixed(2),money(ot*r*m)],['Other additions','—',money(a)]])+'<p class="muted">Illustrative gross earnings</p><div class="metric">'+money(gross)+'</div><p>Tax / insurance: <span class="badge warn">Configured during onboarding</span></p><p>Net pay: —</p>'}
function costing(){let c=state.mode==='construction';return title('FINANCIAL CONTROL',c?'Labor cost by job':'Service margin by post',c?'Explore how working hours and employer costs affect your labor budget.':'Employee pay and client billing are independent calculations.')+card('Explore a labor-cost scenario','<div class="three"><div><label for="costHours">Approved example hours</label><input id="costHours" type="number" value="48" min="0" max="10000" oninput="costCalc()"></div><div><label for="costRate">Blended example wage rate</label><input id="costRate" type="number" value="'+(c?25:18)+'" min="0" max="10000" oninput="costCalc()"></div><div><label for="burden">Illustrative employer burden %</label><input id="burden" type="number" value="12" min="0" max="100" oninput="costCalc()"></div><div><label for="budget">'+(c?'Labor budget XCD':'Client bill rate XCD / hour')+'</label><input id="budget" type="number" value="'+(c?1800:30)+'" min="0" max="100000000" oninput="costCalc()"></div></div><div class="action"><button class="primary" onclick="costCalc()">Calculate model</button></div><div id="costresult"></div><p class="muted mini">Explore cost scenarios using sample hours, a wage rate and an employer-cost allowance. Client billing and employee pay can follow different rates and approved hours.</p>')}
function costCalc(){let [h,r,b,v]=['costHours','costRate','burden','budget'].map(id=>+$(id).value);if(![h,r,b,v].every(Number.isFinite)||Math.min(h,r,b,v)<0||b>100)return toast('Enter valid model inputs');let wage=h*r,cost=wage*(1+b/100),c=state.mode==='construction',revenue=c?v:h*v;$('costresult').innerHTML='<div class="grid" style="margin-top:20px">'+metric('Wages',money(wage),'Example approved allocation')+metric('Employer burden',money(cost-wage),'Illustrative assumption')+metric('Loaded labor cost',money(cost),'Wages plus burden')+metric(c?'Budget remaining':'Service contribution',money(revenue-cost),c?'Budget variance, not profit':'Before overhead / other costs')+'</div>'}
function reports(){return title('MANAGEMENT REPORTING','A clearer view at payroll time.','Explore attendance exports, payslip workflows and accounting handover.')+card('Try an attendance export','<p>Capture time-clock events, review them and download the sample records as a CSV file.</p><button class="primary" onclick="exportCSV()">Download sample attendance CSV</button>')+'<div class="three section" style="margin-top:22px">'+card('Payroll & payslips','Organize pay periods, recurring adjustments and employee payslip workflows in one service experience.')+card('QuickBooks handover','Discuss how your payroll accounts, employee liabilities and job-cost reporting can fit your accounting workflow.<p><span class="badge">Explore integration options</span></p>')+card('Management reporting','Bring attendance, labor allocation and payroll reporting into a clearer monthly review.<p><span class="badge">Discuss your reporting needs</span></p>')+'</div><div class="notice">Sample exports only. This demo is not connected to your accounting system, bank or statutory filing service.</div>'}
function exportCSV(){let lines=[['Employee','Event','UTC time','Site','Code','Source','Status'],...state.events.filter(e=>e.mode===state.mode).map(e=>[e.name,e.type,e.time,e.site,e.code,e.source,e.status])];let csv=lines.map(r=>r.map(v=>'"'+String(v).replace(/^[=+@-]/,"' $&").replace(/"/g,'""')+'"').join(',')).join('\r\n');download(csv,'OECS_'+state.mode+'_demo_time.csv','text/csv')}
function download(text,name,type){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function review(){let c=state.mode==='construction';return title('THE OECS WORKFORCE EXPERIENCE','Run your workforce with a clearer view.','Payroll as a Service, shaped around the way Caribbean businesses work.')+'<div class="hero"><div><h2>Your business has its own rhythm.</h2><p>Your workforce platform should follow it—from a busy job site to a round-the-clock security operation.</p></div><button class="gold" onclick="go(\'Contact us\')">Arrange a demonstration →</button></div><div class="three">'+card('Time & attendance','Personal and shared-device clock workflows, lunch and break records, site selection and supervisor review.')+card('People & payroll','Employee records, leave requests, recurring additions and deductions, loans, payroll history and payslip workflows.')+card('Management visibility','Attendance reporting, multi-company paymaster workspaces, labor cost views and accounting handover workflows.')+'</div><div class="two" style="margin-top:22px">'+card('Construction companies','<p>Connect projects, crews, trades and work sites. Explore time allocated to cost codes and labor budgets, and bring daily work records into payroll preparation.</p><ul><li>Project and crew visibility</li><li>Site transfers and travel categories</li><li>Labor budget comparison</li><li>Contractor and equipment workflows</li></ul><button onclick="edition(\'construction\');go(\'Overview\')">Explore construction →</button>')+card('Security companies','<p>Connect client sites, guard assignments and overnight coverage. Explore relief assignment, time review and the relationship between employee cost and client billing.</p><ul><li>Post and shift roster</li><li>Overnight duty and relief cover</li><li>Guard tour and incident workflows</li><li>Client service and billing visibility</li></ul><button onclick="edition(\'security\');go(\'Overview\')">Explore security →</button>')+'</div>'+card('A practical start for your company','<p>Tell us your country, workforce size, pay cycle and sites. We will walk through your requirements and discuss a suitable setup, onboarding and support arrangement.</p><button class="primary" onclick="go(\'Contact us\')">Talk to B. Cuthbert John →</button>')+'<div class="notice">This demonstration illustrates the service experience. Available modules, integrations and country payroll configuration are agreed during onboarding.</div>'}
function buildplan(){return title('LET’S DISCUSS YOUR WORKFORCE','Put your business in the picture.','Arrange a tailored demonstration for your construction or security company.')+'<div class="two">'+card('Speak with us','<h3>B. Cuthbert John</h3><p>OECS Workforce · Payroll as a Service</p><p><a href="mailto:cuthbert@oecstrading.com">cuthbert@oecstrading.com</a></p><p><a href="tel:+19544786113">Call +1 (954) 478-6113</a></p><p><a href="https://wa.me/17584881429" target="_blank" rel="noopener">WhatsApp +1 (758) 488-1429 →</a></p><p class="muted">Tell us about your company, country, number of employees and payroll cycle. We can focus the conversation on your day-to-day operations.</p>')+card('Prepare your enquiry','<form onsubmit="prepareEnquiry(event)"><label for="contactName">Your name</label><input id="contactName" required autocomplete="name"><label for="contactCompany">Company</label><input id="contactCompany" required autocomplete="organization"><label for="contactEmail">Email</label><input id="contactEmail" type="email" required autocomplete="email"><label for="contactPhone">Phone / WhatsApp</label><input id="contactPhone" type="tel" autocomplete="tel"><label for="contactCountry">Country</label><input id="contactCountry" required><label for="contactIndustry">Industry</label><select id="contactIndustry"><option>Construction</option><option>Security</option><option>Other</option></select><label for="contactSize">Number of employees</label><input id="contactSize" type="number" min="1" required><label for="contactMessage">What would you like to improve?</label><textarea id="contactMessage" rows="3" required></textarea><div class="action"><button class="primary">Prepare email enquiry →</button></div><p class="mini muted">Opens your email application with a prepared draft for you to review and send. This form does not submit or store your enquiry.</p></form>')+'</div>'}
function prepareEnquiry(e){e.preventDefault();let ids=['contactName','contactCompany','contactEmail','contactPhone','contactCountry','contactIndustry','contactSize','contactMessage'],labels=['Name','Company','Email','Phone / WhatsApp','Country','Industry','Employees','Requirements'];let body=ids.map((id,i)=>labels[i]+': '+$(id).value).join('\n');location.href='mailto:cuthbert@oecstrading.com?subject='+encodeURIComponent('OECS Workforce demonstration enquiry — '+$('contactCompany').value)+'&body='+encodeURIComponent(body);toast('Email draft prepared. Review and send it in your email application.')}
function tick(){if($('time'))$('time').textContent=new Date().toLocaleTimeString('en-GB',{timeZone:'America/St_Lucia'});if(page==='Time clock')clockStatus()}setInterval(tick,1000);

function aiState(){state.ai??={};return state.ai[state.mode]??=( {stage:'ready',issues:[],audit:[],notifications:[],run:null} )}
function aiAudit(action){aiState().audit.unshift({time:new Date().toISOString(),action});persist()}
function aiNotify(text){aiState().notifications.unshift({id:crypto.randomUUID(),text,read:false,time:new Date().toISOString()})}
function aiSignature(){return JSON.stringify({people:people(),events:state.events.filter(e=>e.mode===state.mode),issues:aiState().issues})}
function aiPaymaster(){let a=aiState(),c=state.mode==='construction',open=a.issues.filter(i=>i.status==='Needs approval').length,stale=a.run&&a.run.signature!==aiSignature();return title('YOUR PAYROLL ASSISTANT','AI prepares. You approve.','From attendance exceptions to a payroll pack, keep your Paymaster in control.')+'<div class="hero"><div><span class="mini">AI PAYMASTER · INTERACTIVE DEMONSTRATION</span><h2>Your payroll, ready for a decision.</h2><p>Review time, resolve missed punches, check pay inputs and prepare the payroll for approval.</p></div><button class="gold" onclick="aiScan()">'+(a.stage==='ready'?'Start payroll review':'Review attendance again')+' →</button></div><div class="grid">'+metric('Workflow',a.stage==='ready'?'Ready':a.stage==='approved'?'Approved':a.stage==='prepared'?'Prepared':'Reviewing','Sample weekly payroll')+metric('Missed-punch decisions',open,'Human approval required for each correction')+metric('Paymaster alerts',a.notifications.filter(n=>!n.read).length,'In-app demonstration notifications')+metric('Payroll authority','You approve','AI never releases funds')+'</div><div class="two">'+card('Payroll processing desk',aiDesk(a,open,stale))+card('Paymaster notification centre',a.notifications.length?a.notifications.map(n=>'<div class="listitem"><span class="badge '+(n.read?'':'warn')+'">'+(n.read?'Read':'New')+'</span><p>'+esc(n.text)+'</p><small>'+new Date(n.time).toLocaleString()+'</small> '+(!n.read?'<button onclick="aiRead(\''+n.id+'\')">Mark read</button>':'')+'</div>').join(''):'<p class="muted">Start the payroll review to receive attendance and approval alerts here.</p>')+'</div>'+card('Missed punches & proposed corrections',a.issues.length?table(['Employee','Exception / proposed correction','Evidence','Decision'],a.issues.map((i,k)=>[esc(i.name),'<b>'+esc(i.type)+'</b><p>'+esc(i.proposal)+'</p>',esc(i.evidence),'<span class="badge '+(i.status==='Needs approval'?'warn':'')+'">'+esc(i.status)+'</span><div class="action">'+(i.status==='Needs approval'?'<button onclick="aiCorrection('+k+')">Review & approve</button><button onclick="aiReject('+k+')">Reject proposal</button>':'')+'</div>'])):'<p>Attendance exceptions will appear after the review. Original punch records remain preserved.</p>')+(a.run?aiRunView(a,stale):'')+'<div class="two" style="margin-top:22px">'+card('Payroll service workflow','<div class="listitem">1 · Attendance and missed-punch review</div><div class="listitem">2 · Approved time corrections and leave review</div><div class="listitem">3 · Rates, overtime, additions and deduction checks</div><div class="listitem">4 · Payroll calculation and variance review</div><div class="listitem">5 · Human payroll approval</div><div class="listitem">6 · Payslip, payment, statutory and accounting packs</div>')+card('Activity & approval trail',a.audit.length?a.audit.map(x=>'<div class="listitem"><small>'+new Date(x.time).toLocaleString()+'</small><p>'+esc(x.action)+'</p></div>').join(''):'<p>No actions yet.</p>')+'</div><div class="notice">Guided AI Paymaster simulation with sample data, not a connected AI or live payroll processor. Alerts appear inside this demo only. Corrections require your decision; no messages, payments, statutory filings or accounting entries are sent. Statutory amounts in the sample pack are labelled assumptions.</div>'}
function aiDesk(a,open,stale){let pending=state.events.filter(e=>e.mode===state.mode&&e.status!=='Approved').length;if(a.stage==='ready')return '<p>Let the AI Paymaster assemble the work for your Paymaster: missing punches, time approvals, employee pay inputs and payroll outputs.</p><button class="primary" onclick="aiScan()">Run the sample payroll review</button>';let rows=[['Attendance exceptions',open?open+' decisions needed':'Resolved'],['Captured demo events',pending?pending+' awaiting supervisor review':'No pending events'],['Leave requests',state.leave.filter(l=>l.mode===state.mode).length+' shown for Paymaster review'],['Pay inputs','Current demo employee rates; 40 regular + 8 overtime hours'],['Recurring pay inputs','Sample allowance 20, tax 30, insurance 40, loan 25 per employee'],['Statutory inputs','Fixed demo amounts only; not jurisdiction tax calculations']];return table(['Processing step','Status'],rows)+'<div class="action"><button class="primary" onclick="aiPrepare()" '+(open||pending?'disabled':'')+'>Prepare payroll pack</button>'+(pending?'<button onclick="go(\'Time approval\')">Review captured time</button>':'')+'</div><p class="mini muted">Rejected proposals remain unresolved until a corrected time and supporting evidence are approved. Payroll preparation waits for time exceptions to be resolved.</p>'+(stale?'<p class="badge warn">Inputs changed. Prepare a fresh payroll pack.</p>':'')}
function aiScan(){let a=aiState();if(!a.issues.length){let p=people()[0];a.issues=[{name:p.name,type:'Missing clock-out · sample Wednesday',proposal:'Suggested clock-out 16:00; 07:00 start with 60-minute unpaid break gives 8 paid hours.',evidence:'Sample roster ends 16:00. No actual clock-out recorded. Supervisor confirmation required.',status:'Needs approval',time:'16:00',hours:8}];aiNotify('Attendance review: '+p.name+' has a missed clock-out. Please confirm the proposed correction before payroll preparation.')}a.stage='reviewing';a.run=null;aiAudit('AI Paymaster reviewed sample attendance and queued Paymaster decisions.');render()}
function aiRead(id){aiState().notifications.find(n=>n.id===id).read=true;persist();render()}
function aiCorrection(k){let i=aiState().issues[k];$('modal').innerHTML='<h2>Approve a missed-punch correction</h2><p>'+esc(i.name)+' · '+esc(i.type)+'</p><p class="mini muted">Confirm the actual time with the employee or supervisor. A roster suggestion is not proof of hours worked.</p><form onsubmit="aiSaveCorrection(event,'+k+')"><label for="fixTime">Confirmed clock-out time</label><input id="fixTime" type="time" value="'+i.time+'" min="07:00" max="23:59" required><label for="fixEvidence">Evidence / supervisor confirmation</label><textarea id="fixEvidence" minlength="8" required placeholder="Record who confirmed the time and the supporting evidence"></textarea><label for="fixApprover">Approver name</label><input id="fixApprover" required><label class="row"><input id="fixConfirm" type="checkbox" required> I approve this sample time correction.</label><div class="action"><button class="primary">Approve & apply correction</button><button type="button" onclick="$(\'modal\').close()">Cancel</button></div></form>';$('modal').showModal()}
function aiSaveCorrection(e,k){e.preventDefault();let i=aiState().issues[k],t=$('fixTime').value,h=Number(t.slice(0,2))+Number(t.slice(3))/60-8;if(h<0||h>16)return toast('Confirm a valid clock-out after the sample start and break.');i.time=t;i.hours=h;i.status='Correction approved';i.proposal='Approved clock-out '+t+'; '+h.toFixed(2)+' paid hours (07:00 start, 60-minute unpaid break).';i.evidence=$('fixEvidence').value;i.approver=$('fixApprover').value;aiState().run=null;aiState().stage='reviewing';aiNotify('Approved correction applied to the sample timesheet for '+i.name+'. Original missing-punch record retained in the audit trail.');aiAudit(i.approver+' approved clock-out '+t+' for '+i.name+'. Evidence: '+i.evidence);$('modal').close();render()}
function aiReject(k){let i=aiState().issues[k];aiNotify('Correction proposal rejected for '+i.name+'. Payroll remains on hold pending confirmed time.');aiAudit('Paymaster rejected the proposed time for '+i.name+'; correction remains pending.');i.proposal='Proposal rejected. Enter the confirmed clock-out and evidence to resolve this exception.';aiState().run=null;persist();render()}
function aiPrepare(){let a=aiState();if(a.issues.some(i=>i.status==='Needs approval')||state.events.some(e=>e.mode===state.mode&&e.status!=='Approved'))return toast('Resolve and approve attendance first.');if(!a.issues.length)return toast('Run attendance review first.');let rows=people().map((p,k)=>{let hours=48+(k===0?a.issues[0].hours-8:0),regular=Math.min(hours,40),ot=Math.max(0,hours-40),gross=Math.round((regular*p.rate+ot*p.rate*1.5)*100)/100;return {name:p.name,rate:p.rate,hours,regular,ot,basicGross:gross,gross:gross+20,addition:20,tax:30,insurance:40,employerInsurance:40,loan:25,net:gross+20-95}});a.run={rows,signature:aiSignature(),approved:false,preparedAt:new Date().toISOString(),checklist:false};a.stage='prepared';aiNotify('Payroll pack prepared for '+rows.length+' sample employees. Review earning lines, deductions and exceptions, then approve the pack.');aiAudit('AI Paymaster prepared sample payroll lines, payslip drafts and downstream payroll pack.');render()}
function aiRunView(a,stale){let r=a.run,tot=r.rows.reduce((s,x)=>s+x.gross,0);return '<section class="card" style="margin-top:22px"><div class="row spread"><h2>Payroll pack · sample week</h2><span class="badge '+(r.approved&&!stale?'':'warn')+'">'+(stale?'Recalculation required':r.approved?'Human approved':'Awaiting human approval')+'</span></div><p class="mini muted">Sample baseline: 48 hours per employee, adjusted by the approved missed-punch correction. Overtime assumption: over 40 hours at 1.5×. Values below use sample hours plus an EC$20 allowance, EC$30 tax, EC$40 employee insurance, EC$25 loan repayment and EC$40 employer insurance per employee. These are fixed fictional examples, not country tax rules.</p>'+table(['Employee','Hours / overtime','Rate','Gross incl. allowance','Deductions','Net'],r.rows.map(x=>[esc(x.name),x.hours.toFixed(2)+' / '+x.ot.toFixed(2),money(x.rate),money(x.gross),'Tax '+money(x.tax)+'<br>Insurance '+money(x.insurance)+'<br>Loan '+money(x.loan),money(x.net)]))+'<div class="metric">'+money(tot)+'</div><small>Total illustrative gross payroll · includes EC$20 sample allowance per employee</small><div class="notice">Payroll review covers employee rates, approved corrections, overtime, leave, recurring additions, insurance, tax and loans. Sample net pay is gross less the fixed fictional deductions shown. Production calculations use your verified country rules and employee deductions. Employer insurance is an additional company cost, not a deduction from employee net pay.</div><p><b>Total sample net pay: '+money(r.rows.reduce((s,x)=>s+x.net,0))+'</b> · Employer insurance: '+money(r.rows.reduce((s,x)=>s+x.employerInsurance,0))+' · Total company cost: '+money(r.rows.reduce((s,x)=>s+x.gross+x.employerInsurance,0))+'</p><div class="action">'+(!r.approved?'<button class="primary" onclick="aiApprovalDialog()" '+(stale?'disabled':'')+'>Review & approve demo payroll</button>':'<button class="primary" onclick="aiExport()" '+(stale?'disabled':'')+'>Download approved sample payroll pack</button>')+'</div><div class="three" style="margin-top:20px">'+card('Payslip preparation',r.approved&&!stale?'Sample pay statements included in the downloadable pack.':'Prepared with the pack; available after approval.')+card('Bank & statutory handover','Demonstration checklist only. No bank file, payment or statutory return is submitted.')+card('Accounting handover','Payroll summary and audit details included for review. No QuickBooks posting is made.')+'</div></section>'}
function aiApprovalDialog(){let a=aiState();if(!a.run||a.run.signature!==aiSignature())return toast('Prepare a fresh pack first.');$('modal').innerHTML='<h2>Human approval of demo payroll</h2><p>Approve the illustrative payroll pack for demonstration. No payment will be released.</p><form onsubmit="aiApproveRun(event)"><label for="runApprover">Paymaster / approver name</label><input id="runApprover" required><label class="row"><input type="checkbox" required> I reviewed sample hours, corrections, rates and overtime.</label><label class="row"><input type="checkbox" required> I reviewed the fixed fictional allowance, tax, insurance and loan figures used in this demonstration.</label><div class="action"><button class="primary">Approve demonstration pack</button><button type="button" onclick="$(\'modal\').close()">Cancel</button></div></form>';$('modal').showModal()}
function aiApproveRun(e){e.preventDefault();let a=aiState();if(a.run.signature!==aiSignature())return toast('Inputs changed; prepare a fresh pack.');a.run.approved=true;a.run.approver=$('runApprover').value;a.stage='approved';aiNotify('Human approval recorded. Your sample payroll pack is ready to download. No money has been released.');aiAudit(a.run.approver+' approved the sample payroll pack. No payment authorized or executed.');$('modal').close();render()}
function aiExport(){let a=aiState();if(!a.run?.approved||a.run.signature!==aiSignature())return toast('A current approved pack is required.');let pack={title:'OECS Workforce — approved DEMONSTRATION payroll pack',edition:state.mode,approvedBy:a.run.approver,preparedAt:a.run.preparedAt,boundary:'Synthetic example only. Fixed fictional deductions and allowances; not statutory calculations. No payment, notification, filing or accounting posting executed.',payroll:a.run.rows,payslips:a.run.rows.map(x=>({employee:x.name,regularHours:x.regular,overtimeHours:x.ot,hourlyRate:x.rate,gross:x.gross,allowance:x.addition,tax:x.tax,employeeInsurance:x.insurance,loan:x.loan,employerInsurance:x.employerInsurance,netPay:x.net,status:'Sample pay statement'})),corrections:a.issues,audit:a.audit,handover:{bank:'Not submitted',statutory:'Not submitted',quickbooks:'Not posted'}};download(JSON.stringify(pack,null,2),'OECS_'+state.mode+'_Approved_Demo_Payroll.json','application/json');aiAudit('Approved demonstration payroll pack downloaded for review.');render()}

render();</script></body></html>
